name: Build nightly prerelease

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact immutable main commit SHA to build
        required: true
        type: string
  schedule:
    # 02:17 UTC (04:17 Zurich in summer, 03:17 in winter). Skipped when main has not moved.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  guard:
    # workflow_dispatch can be launched from another ref; nightly candidates may only originate on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      skip: ${{ steps.candidate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule ]]; then
            # Scheduled runs build the current main, unless the latest published nightly already has it.
            git fetch origin main
            REQUESTED_SHA="$(git rev-parse origin/main)"
            latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,publishedAt \
              --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.publishedAt) | last | .tagName // ""')"
            if [[ -n "$latest_tag" ]]; then
              latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest_tag" --jq .sha)"
              if [[ "$latest_sha" == "$REQUESTED_SHA" ]]; then
                echo "main ($REQUESTED_SHA) is unchanged since $latest_tag; skipping the scheduled nightly." >> "$GITHUB_STEP_SUMMARY"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          actual="$(git rev-parse "$REQUESTED_SHA^{commit}")"
          test "$actual" = "${REQUESTED_SHA,,}"
          git fetch origin main
          git merge-base --is-ancestor "$actual" origin/main
          date_utc="$(date -u +%Y%m%d)"
          base_version="$(git show "$actual:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(JSON.parse(input).version))")"
          version="$(node scripts/release-channel.mjs nightly-version "$base_version" "$date_utc" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      # Reads only the checked-out index, so the shallow candidate checkout is enough.
      - name: Scan tracked files for credentials and forbidden data paths
        run: node scripts/secret-scan.mjs
      - run: npm ci --prefix share-service
      - run: npm test --prefix share-service
      - run: npm audit --prefix share-service --omit=dev --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:share-contract
      # pnpm test already includes the release-channel and asset-staging tests.
      # Each package job builds and smoke-tests the actual distributable.
      - run: bash -n scripts/install.sh

  package:
    # Build alongside quality; publish still requires both to pass.
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: pnpm exec electron-builder --linux --publish never --config.extraMetadata.version=${{ needs.guard.outputs.version }} --config.publish.channel=nightly --config.publish.releaseType=prerelease
          - os: windows-latest
            platform: windows
            command: pnpm exec electron-builder --win --publish never --config.extraMetadata.version=${{ needs.guard.outputs.version }} --config.publish.channel=nightly --config.publish.releaseType=prerelease
          - os: macos-latest
            platform: macos
            command: pnpm exec electron-builder --mac --universal --publish never --config.extraMetadata.version=${{ needs.guard.outputs.version }} --config.publish.channel=nightly --config.publish.releaseType=prerelease
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.platform == 'windows'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture MCP client Node
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '"IMNOTA_MCP_CLIENT_NODE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm build
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and launch the macOS nightly archive
        if: matrix.platform == 'macos'
        run: bash scripts/verify-mac.sh
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}
          IMNOTA_EXPECT_VERSION: ${{ needs.guard.outputs.version }}
      - name: Retain Mac walkthrough evidence
        if: always() && matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-walkthrough-evidence-nightly
          path: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore

      - name: Smoke packaged Windows nightly
        if: matrix.platform == 'windows'
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_EXPECT_VERSION: ${{ needs.guard.outputs.version }}
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-nightly-windows
      - name: Compare approved Windows visuals
        if: matrix.platform == 'windows'
        run: pnpm test:visual tests/visual/win32 "${{ runner.temp }}/imnota-verification-artifacts-nightly-windows" "${{ runner.temp }}/imnota-visual-differences"
      - name: Retain Windows visual evidence
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-evidence-nightly
          path: |
            ${{ runner.temp }}/imnota-verification-artifacts-nightly-windows/
            ${{ runner.temp }}/imnota-visual-differences/
      - name: Smoke packaged Linux nightly
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
        env:
          IMNOTA_EXPECT_VERSION: ${{ needs.guard.outputs.version }}
      # Evidence must remain outside the publish job's nightly-* artifact pattern.
      - name: Retain packaged MCP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-evidence-${{ matrix.platform }}
          path: release/imnota-verification-artifacts-mcp/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/nightly*.yml
          if-no-files-found: error

  publish:
    needs: [guard, quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: release-assets
          merge-multiple: true
      - name: Validate nightly manifests and assets
        run: node scripts/stage-release-assets.mjs release-assets '${{ needs.guard.outputs.version }}' nightly nightly
      - name: Create draft prerelease with verified assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          target_commitish: ${{ needs.guard.outputs.sha }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Publish the verified prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          target_commitish: ${{ needs.guard.outputs.sha }}
          draft: false
          prerelease: true
          make_latest: false

  staleness:
    # Runs after every scheduled or manual attempt, including failed or skipped ones, so a broken
    # nightly cannot go unnoticed: alert when main is ahead of a nightly published over 48 hours ago.
    needs: [guard, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the "Nightly is stale" issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          latest="$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.publishedAt) | last // {} | [.tagName // "", .publishedAt // ""] | @tsv')"
          IFS=$'\t' read -r tag published <<< "$latest"
          if [[ -n "$tag" ]]; then
            nightly_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            age_hours=$(( ($(date -u +%s) - $(date -u -d "$published" +%s)) / 3600 ))
          else
            nightly_sha=""
            age_hours=999999
          fi
          if [[ "$nightly_sha" == "$main_sha" || "$age_hours" -le 48 ]]; then
            echo "Nightly ${tag:-none} is ${age_hours}h old and main is ${main_sha:0:7}; not stale."
            exit 0
          fi
          ahead="$(gh api "repos/$GH_REPO/compare/${nightly_sha:-$main_sha}...$main_sha" --jq .ahead_by 2>/dev/null || echo unknown)"
          body="$(printf 'The latest nightly is more than 48 hours behind main.\n\n- Latest nightly: %s (published %s, %sh ago, commit %s)\n- main: %s (%s commits ahead)\n- Checked by: %s\n\nRun **Build nightly prerelease** or check why the scheduled run did not publish.' \
            "${tag:-none}" "${published:-never}" "$age_hours" "${nightly_sha:0:7}" "${main_sha:0:7}" "$ahead" "$RUN_URL")"
          existing="$(gh issue list --state open --search 'in:title "Nightly is stale"' --json number,title \
            --jq '[.[] | select(.title == "Nightly is stale")][0].number // ""')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly is stale" --body "$body"
          fi
