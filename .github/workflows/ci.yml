name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running validation; main-branch pushes keep
# their own group per commit so every merged revision is still validated in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: classify
        name: Classify the exact PR changes
        run: node scripts/ci-changes.mjs
        env:
          IMNOTA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IMNOTA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  share-service:
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      RUN_APPLICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    name: Share service security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: share-service
    steps:
      - name: Documentation-only PR
        if: env.RUN_APPLICATION != 'true'
        working-directory: .
        shell: bash
        run: echo 'Application checks are unchanged for code and main-branch changes; this PR only changes reviewed prose paths.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_APPLICATION == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_APPLICATION == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: share-service/package-lock.json
      - run: npm ci
        if: env.RUN_APPLICATION == 'true'
      - run: npm test
        if: env.RUN_APPLICATION == 'true'
      - run: npm audit --omit=dev --audit-level=high
        if: env.RUN_APPLICATION == 'true'
      # Reuse this per-OS runner and the installed service for source verification.
      # Service security keeps Node 24; application/platform checks keep Node 22.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN_APPLICATION == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_APPLICATION == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.RUN_APPLICATION == 'true'
        working-directory: .
      - run: pnpm exec install-electron
        if: env.RUN_APPLICATION == 'true'
        working-directory: .
      # Script tests exercise Windows PowerShell before Vitest's native lock test
      # starts its timed reader. A fresh test runner no longer has packaging setup.
      - run: pnpm test:scripts
        if: env.RUN_APPLICATION == 'true'
        working-directory: .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test platform-specific behavior
        if: env.RUN_APPLICATION == 'true'
        working-directory: .
        run: pnpm exec vitest run --config vitest.platform.config.ts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: pnpm test:share-contract
        if: env.RUN_APPLICATION == 'true'
        working-directory: .

  quality:
    # Keep the strict branch-protection context and wait for every Validate gate.
    # Only classifier/event-authorized skips may pass; failures/cancellations never do.
    needs: [changes, quality-checks, share-service, package, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require all applicable validation jobs
        env:
          IMNOTA_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-quality-gate.mjs

  quality-checks:
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      RUN_APPLICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only PR
        if: env.RUN_APPLICATION != 'true'
        working-directory: .
        shell: bash
        run: echo 'Application checks are unchanged for code and main-branch changes; this PR only changes reviewed prose paths.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
        if: env.RUN_APPLICATION == 'true'
      # Reads only the checked-out index (git ls-files, git show :path), so the default shallow
      # checkout is enough. Runs for documentation-only PRs too: prose can carry a pasted credential.
      - name: Scan tracked files for credentials and forbidden data paths
        run: node scripts/secret-scan.mjs
      - run: pnpm format:check
      - name: Lint workflow files
        if: env.RUN_APPLICATION == 'true'
        # The container bundles shellcheck; style-level hints stay advisory, warnings and errors fail.
        run: docker run --rm --volume "${PWD}:/repo" --workdir /repo --env SHELLCHECK_OPTS=--severity=warning rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: pnpm lint
        if: env.RUN_APPLICATION == 'true'
      - run: pnpm typecheck
        if: env.RUN_APPLICATION == 'true'
      # The same Vitest discovery runs once, with coverage. Test failures gate;
      # coverage percentages remain diagnostic, with no thresholds.
      - name: Test application with coverage
        id: coverage
        if: env.RUN_APPLICATION == 'true'
        timeout-minutes: 10
        run: pnpm test:coverage
      - run: pnpm test:scripts
        if: env.RUN_APPLICATION == 'true'
      - name: Retain application coverage report
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: npm ci --prefix share-service
        if: env.RUN_APPLICATION == 'true'
      - run: pnpm typecheck:share-service
        if: env.RUN_APPLICATION == 'true'
      - run: pnpm test:share-contract
        if: env.RUN_APPLICATION == 'true'
      # Each package job builds and runs the native walkthrough against its distributable.
      # Keep quality focused on static, unit, script, and share-contract checks.
      - run: bash -n scripts/install.sh
        if: env.RUN_APPLICATION == 'true'

  package:
    permissions:
      contents: read
      actions: read
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      RUN_APPLICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: pnpm package:linux
          - os: windows-latest
            command: pnpm package:win
          - os: macos-latest
            command: pnpm package:mac
    runs-on: ${{ matrix.os }}
    # Ordinary, focused and fixed fault partitions retain their existing per-child deadlines.
    timeout-minutes: 45
    steps:
      - name: Documentation-only PR
        if: env.RUN_APPLICATION != 'true'
        working-directory: .
        shell: bash
        run: echo 'Application checks are unchanged for code and main-branch changes; this PR only changes reviewed prose paths.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_APPLICATION == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'windows-latest'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture MCP client Node
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: '"IMNOTA_MCP_CLIENT_NODE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN_APPLICATION == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_APPLICATION == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.RUN_APPLICATION == 'true'
      - run: pnpm exec install-electron
        if: env.RUN_APPLICATION == 'true'
      - run: ${{ matrix.command }}${{ matrix.os == 'ubuntu-latest' && ' --config.deb.compression=gz' || '' }}
        if: env.RUN_APPLICATION == 'true'
      # This script's native updater case needs the actual universal ZIP. All other
      # platform/script tests run concurrently in platform, without a package dependency.
      - name: Test packaged Mac updater and rollback
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        run: node --test scripts/update-macos.test.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          IMNOTA_REQUIRE_MAC_UPDATE_TEST: '1'
      - name: Build Mac in-app update fixture
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        run: pnpm exec electron-builder --mac zip --universal --publish never --config.extraMetadata.version=0.0.0 --config.directories.output="${{ runner.temp }}/imnota-live-update-fixture"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify live Mac in-app update from Applications
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        run: node scripts/verify-mac-in-app.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          IMNOTA_CI_RELEASE_TOKEN: ${{ github.token }}
          IMNOTA_MAC_UPDATE_FIXTURE_ARCHIVE: ${{ runner.temp }}/imnota-live-update-fixture/Imnota-0.0.0-universal-mac.zip
          IMNOTA_MAC_IN_APP_EVIDENCE: ${{ runner.temp }}/imnota-verification-artifacts-live-update
      - name: Retain live Mac update evidence
        if: always() && env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-in-app-update-evidence
          path: ${{ runner.temp }}/imnota-verification-artifacts-live-update/
          if-no-files-found: error
      - name: Verify packaged Mac application
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'macos-latest')
        run: bash scripts/verify-mac.sh
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify native Mac installer transactions
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          export IMNOTA_NATIVE_MAC_ARCHIVE="$PWD/release/Imnota-${version}-universal-mac.zip"
          node --test scripts/install.native-mac.test.mjs

      - name: Retain Mac walkthrough evidence
        if: env.RUN_APPLICATION == 'true' && (!cancelled() && matrix.os == 'macos-latest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-walkthrough-evidence-ci
          path: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore

      # Exports every bundle through the real workspace action, copies each with Rich copy and
      # natively pastes it, so a change to bundle export or copy cannot merge silently.
      - name: Verify packaged Mac bundle copy and paste
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'macos-latest')
        run: bash scripts/verify-mac.sh
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Smoke packaged Windows application
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'windows-latest')
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-windows
      - name: Verify packaged Windows bundle copy and paste
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'windows-latest')
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Compare approved Windows visuals
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'windows-latest')
        run: pnpm test:visual tests/visual/win32 "${{ runner.temp }}/imnota-verification-artifacts-windows" "${{ runner.temp }}/imnota-visual-differences"
      - name: Retain Windows visual evidence
        if: env.RUN_APPLICATION == 'true' && (!cancelled() && matrix.os == 'windows-latest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-evidence
          path: |
            ${{ runner.temp }}/imnota-verification-artifacts-windows/
            ${{ runner.temp }}/imnota-visual-differences/
      - name: Smoke packaged Linux application
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'ubuntu-latest')
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-ci-linux
      - name: Verify packaged Linux bundle copy and paste
        if: env.RUN_APPLICATION == 'true' && (matrix.os == 'ubuntu-latest')
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Retain bundle copy evidence
        if: env.RUN_APPLICATION == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipboard-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-clipboard/
          if-no-files-found: ignore
      - name: Verify packaged native faults on macos
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'macos-latest'
        run: bash scripts/verify-mac.sh --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Verify packaged native faults on windows
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'windows-latest'
        run: node scripts/verify-packaged.mjs windows --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Verify packaged native faults on linux
        if: env.RUN_APPLICATION == 'true' && matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Retain native fault evidence
        id: native_fault_upload
        if: env.RUN_APPLICATION == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-fault-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-native-faults/
          if-no-files-found: error
          include-hidden-files: true
      - name: Download native fault evidence for manifest verification
        id: native_fault_download
        if: always() && steps.native_fault_upload.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.native_fault_upload.outputs.artifact-id }}
          # Same-job downloads use the current-run service; REST publication can lag upload completion.
          path: ${{ runner.temp }}/imnota-verification-artifacts-native-faults-downloaded/
      - name: Verify downloaded native fault evidence manifest
        if: always() && steps.native_fault_download.outcome == 'success'
        run: node scripts/smoke.mjs --verify-fault-evidence "${{ runner.temp }}/imnota-verification-artifacts-native-faults-downloaded"
      # Diagnostic artifacts must never match the publication asset pattern.
      - name: Retain packaged smoke failure evidence
        if: env.RUN_APPLICATION == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failure-evidence-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain review installers and build diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.RUN_APPLICATION == 'true'
        with:
          name: imnota-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/builder-debug.yml
            release/package-contents-*.json
            release/builder-effective-config.yaml
          if-no-files-found: error
          compression-level: 0
      - name: Retain packaged MCP evidence
        if: env.RUN_APPLICATION == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-evidence-${{ matrix.os }}
          path: release/imnota-verification-artifacts-mcp/
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action reads the dependency diff and writes a job summary. It posts no PR comment
    # (comment-summary-in-pr is unset), so it needs no pull-requests permission.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
