name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Two runs for one tag (a re-pushed tag or a re-run) would race on the same GitHub release.
# Queue them instead; a publication already in flight is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      sha: ${{ steps.classify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/release-channel.mjs classify-tag "$GITHUB_REF_NAME")"
          test "$channel" = stable
          candidate="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$candidate" = "$(git rev-parse HEAD)"
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$candidate" origin/main
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected); process.exit(1); }"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

  quality:
    needs: classify
    if: needs.classify.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      # Reads only the checked-out index, so the shallow candidate checkout is enough.
      - name: Scan tracked files for credentials and forbidden data paths
        run: node scripts/secret-scan.mjs
      # The same share-service gates as the nightly quality job.
      - run: npm ci --prefix share-service
      - run: npm test --prefix share-service
      - run: npm audit --prefix share-service --omit=dev --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the release-channel and asset-staging script tests.
      - run: pnpm test
      - run: pnpm test:share-contract

  package:
    # Build alongside quality; publication requires both to pass.
    needs: classify
    if: needs.classify.outputs.channel == 'stable'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: pnpm package:linux
          - os: windows-latest
            platform: windows
            command: pnpm package:win
          - os: macos-latest
            platform: macos
            command: pnpm package:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Test platform-specific behavior
        run: pnpm test:platform
      - name: Set expected stable package version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'IMNOTA_EXPECT_VERSION=' + require('./package.json').version + String.fromCharCode(10))"
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and launch the macOS release archive
        if: matrix.platform == 'macos'
        shell: bash
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}
          IMNOTA_REQUIRE_MAC_UPDATE_TEST: '1'
        run: |
          node --test scripts/update-macos.test.mjs
          bash scripts/verify-mac.sh
      - name: Retain Mac walkthrough evidence
        if: always() && matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-walkthrough-evidence-release
          path: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore

      - name: Smoke packaged Windows application
        if: matrix.platform == 'windows'
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-release-windows
      - name: Compare approved Windows visuals
        if: matrix.platform == 'windows'
        run: pnpm test:visual tests/visual/win32 "${{ runner.temp }}/imnota-verification-artifacts-release-windows" "${{ runner.temp }}/imnota-visual-differences"
      # The artifact name must stay outside the publish job's release-* download pattern.
      - name: Retain Windows visual evidence
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-evidence-release
          path: |
            ${{ runner.temp }}/imnota-verification-artifacts-release-windows/
            ${{ runner.temp }}/imnota-visual-differences/
      - name: Smoke packaged Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
      - name: Verify packaged native faults on macos
        if: matrix.platform == 'macos'
        run: bash scripts/verify-mac.sh --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Verify packaged native faults on windows
        if: matrix.platform == 'windows'
        run: node scripts/verify-packaged.mjs windows --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Verify packaged native faults on linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux --faults
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-native-faults
      - name: Retain native fault evidence
        id: native_fault_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-fault-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-native-faults/
          if-no-files-found: error
          include-hidden-files: true
      - name: Download native fault evidence for manifest verification
        if: always() && steps.native_fault_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-fault-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-native-faults-downloaded/
      - name: Verify downloaded native fault evidence manifest
        if: always() && steps.native_fault_upload.outcome == 'success'
        run: node scripts/smoke.mjs --verify-fault-evidence "${{ runner.temp }}/imnota-verification-artifacts-native-faults-downloaded"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
      # Evidence must remain outside the publish job's release-* artifact pattern.
      - name: Retain packaged MCP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-evidence-${{ matrix.platform }}
          path: release/imnota-verification-artifacts-mcp/
          if-no-files-found: ignore

  publish:
    needs: [classify, quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Stage exact stable release assets
        run: node scripts/stage-release-assets.mjs release-assets "${GITHUB_REF_NAME#v}" latest stable
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: false

  verify-public-mac-install:
    needs: [classify, publish]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Download and install the published Mac release
        run: bash scripts/install.sh
        env:
          IMNOTA_RELEASE_TAG: ${{ github.ref_name }}
      - name: Set exact public version expectation
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'IMNOTA_EXPECT_VERSION=' + process.env.GITHUB_REF_NAME.slice(1) + String.fromCharCode(10))"
      - name: Test the installed public download
        run: node scripts/smoke.mjs "$HOME/Applications/Imnota.app/Contents/MacOS/Imnota"

  promote-latest:
    needs: verify-public-mac-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the verified stable release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)"
          test -n "$release_id"
          export RELEASE_ID="$release_id"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f make_latest=true
