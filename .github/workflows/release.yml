name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/release-channel.mjs classify-tag "$GITHUB_REF_NAME")"
          test "$channel" = stable
          candidate="$(git rev-parse "$GITHUB_REF^{commit}")"
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$candidate" origin/main
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  package:
    needs: classify
    if: needs.classify.outputs.channel == 'stable'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: pnpm package:linux
          - os: windows-latest
            platform: windows
            command: pnpm package:win
          - os: macos-latest
            platform: macos
            command: pnpm package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/release-channel.test.mjs scripts/stage-release-assets.test.mjs
      - name: Verify release version
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected); process.exit(1); }"
      - name: Set expected stable package version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'IMNOTA_EXPECT_VERSION=' + require('./package.json').version + String.fromCharCode(10))"
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and launch the macOS release archive
        if: matrix.platform == 'macos'
        shell: bash
        env:
          IMNOTA_REQUIRE_MAC_UPDATE_TEST: '1'
        run: |
          node --test scripts/update-macos.test.mjs
          bash scripts/verify-mac.sh
      - name: Smoke packaged Windows application
        if: matrix.platform == 'windows'
        run: node scripts/verify-packaged.mjs windows
      - name: Smoke packaged Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Stage exact stable release assets
        run: node scripts/stage-release-assets.mjs release-assets "${GITHUB_REF_NAME#v}" latest stable
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: false

  verify-public-mac-install:
    needs: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download and install the published Mac release
        run: bash scripts/install.sh
        env:
          IMNOTA_RELEASE_TAG: ${{ github.ref_name }}
      - name: Set exact public version expectation
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'IMNOTA_EXPECT_VERSION=' + process.env.GITHUB_REF_NAME.slice(1) + String.fromCharCode(10))"
      - name: Test the installed public download
        run: node scripts/smoke.mjs "$HOME/Applications/Imnota.app/Contents/MacOS/Imnota"

  promote-latest:
    needs: verify-public-mac-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the verified stable release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)"
          test -n "$release_id"
          export RELEASE_ID="$release_id"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f make_latest=true
