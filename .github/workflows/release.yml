name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: pnpm package:linux
          - os: windows-latest
            platform: windows
            command: pnpm package:win
          - os: macos-latest
            platform: macos
            command: pnpm package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify release version
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected); process.exit(1); }"
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add stable installer names
        shell: bash
        run: |
          set -euo pipefail
          cp "$(find release-assets -maxdepth 1 -type f -name 'Imnota Setup *.exe' -print -quit)" release-assets/Imnota-Setup.exe
          cp "$(find release-assets -maxdepth 1 -type f -name '*-mac.zip' -print -quit)" release-assets/Imnota-mac.zip
          cp "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)" release-assets/Imnota.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
