name: Validate package

# Validate-only packaging policy. Nightly/stable keep their own commands and compression.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      run_application:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.candidate.outputs.path }}
    steps:
      - name: Documentation-only PR
        if: ${{ !inputs.run_application }}
        shell: bash
        run: echo 'Application checks are unchanged for code and main-branch changes; this PR only changes reviewed prose paths.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run_application
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.run_application
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.run_application
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.run_application
      - run: pnpm exec install-electron
        if: inputs.run_application
      # These overrides are scoped to Validate, including main pushes. Do not move
      # them into package.json: shipped compressed artifacts are verified by nightly.
      - run: pnpm package:win --config.compression=store
        if: inputs.run_application && inputs.os == 'windows-latest'
      - run: pnpm package:linux --config.deb.compression=gz
        if: inputs.run_application && inputs.os == 'ubuntu-latest'
      - name: Build universal Mac ZIP
        run: |
          pnpm build
          pnpm exec electron-builder --mac zip --universal --publish never
        if: inputs.run_application && inputs.os == 'macos-latest'
      - name: Select the exact clipboard distributable
        id: candidate
        if: inputs.run_application
        shell: bash
        env:
          TARGET_OS: ${{ inputs.os }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$TARGET_OS" in
            windows-latest) candidate="release/Imnota $version.exe" ;;
            ubuntu-latest) candidate="release/Imnota-$version.AppImage" ;;
            macos-latest) candidate="release/Imnota-$version-universal-mac.zip" ;;
            *) exit 1 ;;
          esac
          test -f "$candidate"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"
      # Publish before any walkthrough. Both verification jobs consume this same file.
      - name: Upload verification candidate
        if: inputs.run_application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipboard-candidate-${{ inputs.os }}
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # The standard Windows MCP check also needs the direct executable and bundled relay.
      - name: Upload Windows MCP application
        if: inputs.run_application && inputs.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-mcp-application
          path: release/win-unpacked/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain review installers and build diagnostics
        if: inputs.run_application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imnota-${{ inputs.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/builder-debug.yml
            release/builder-effective-config.yaml
          if-no-files-found: error
          compression-level: 0

  walkthrough:
    needs: build
    if: inputs.run_application
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.os == 'windows-latest'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture MCP client Node
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: '"IMNOTA_MCP_CLIENT_NODE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm exec tsc -p tsconfig.electron.build.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clipboard-candidate-${{ inputs.os }}
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.os == 'windows-latest'
        with:
          name: windows-mcp-application
          path: release/win-unpacked
      # This script's native updater case needs the actual universal ZIP. All other
      # platform/script tests run concurrently in platform, without a package dependency.
      - name: Test packaged Mac updater and rollback
        if: inputs.os == 'macos-latest'
        run: node --test scripts/update-macos.test.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          IMNOTA_REQUIRE_MAC_UPDATE_TEST: '1'
      - name: Verify packaged Mac application
        if: (inputs.os == 'macos-latest')
        run: bash scripts/verify-mac.sh
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain Mac walkthrough evidence
        if: (!cancelled() && inputs.os == 'macos-latest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-walkthrough-evidence-ci
          path: ${{ runner.temp }}/imnota-verification-artifacts-mac-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore

      - name: Smoke packaged Windows application
        if: (inputs.os == 'windows-latest')
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-windows
      - name: Compare approved Windows visuals
        if: (inputs.os == 'windows-latest')
        run: pnpm test:visual tests/visual/win32 "${{ runner.temp }}/imnota-verification-artifacts-windows" "${{ runner.temp }}/imnota-visual-differences"
      - name: Retain Windows visual evidence
        if: (!cancelled() && inputs.os == 'windows-latest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-evidence
          path: |
            ${{ runner.temp }}/imnota-verification-artifacts-windows/
            ${{ runner.temp }}/imnota-visual-differences/
      - name: Restore AppImage executable permission
        if: inputs.os == 'ubuntu-latest'
        run: chmod +x "${{ needs.build.outputs.candidate }}"
      - name: Smoke packaged Linux application
        if: (inputs.os == 'ubuntu-latest')
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
      - name: Retain packaged MCP evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-evidence-${{ inputs.os }}
          path: release/imnota-verification-artifacts-mcp/
          if-no-files-found: ignore

  clipboard:
    needs: build
    if: inputs.run_application
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clipboard-candidate-${{ inputs.os }}
          path: release
      - name: Restore AppImage executable permission
        if: inputs.os == 'ubuntu-latest'
        run: chmod +x "${{ needs.build.outputs.candidate }}"
      # The existing launcher creates its own fresh profile on this fresh runner.
      - name: Verify packaged Mac bundle copy and paste
        if: inputs.os == 'macos-latest'
        run: bash scripts/verify-mac.sh
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Verify packaged Windows bundle copy and paste
        if: inputs.os == 'windows-latest'
        run: node scripts/verify-packaged.mjs windows
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Verify packaged Linux bundle copy and paste
        if: inputs.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/verify-packaged.mjs linux
        env:
          IMNOTA_SMOKE_MODE: clipboard
          IMNOTA_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/imnota-verification-artifacts-clipboard
      - name: Retain bundle copy evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipboard-evidence-${{ inputs.os }}
          path: ${{ runner.temp }}/imnota-verification-artifacts-clipboard/
          if-no-files-found: ignore

  dmg:
    needs: build
    if: inputs.run_application && inputs.os == 'macos-latest'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clipboard-candidate-${{ inputs.os }}
          path: release
      - name: Build DMG from the verified universal app
        run: |
          ditto -x -k "${{ needs.build.outputs.candidate }}" "$RUNNER_TEMP/dmg-input"
          pnpm exec electron-builder --mac dmg --universal --prepackaged "$RUNNER_TEMP/dmg-input/Imnota.app" --publish never
      - name: Retain review DMG and build diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imnota-macos-dmg
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
            release/builder-debug.yml
            release/builder-effective-config.yaml
          if-no-files-found: error
          compression-level: 0
